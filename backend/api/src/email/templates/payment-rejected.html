<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f5;padding:32px 0;">
    <tr><td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;">
        <tr><td style="background:#111111;padding:24px 32px;">
          <span style="color:#ffffff;font-size:18px;font-weight:700;letter-spacing:0.5px;">PixelArt</span>
        </td></tr>
        <tr><td style="padding:32px;">
          <h1 style="margin:0 0 16px;font-size:20px;color:#9a3412;">Hubo un problema con tu pago</h1>
          <p style="margin:0 0 16px;font-size:14px;line-height:1.6;color:#374151;">
            Hola {{customerName}}, no pudimos validar tu comprobante de pago.
          </p>
          <div style="background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:14px 18px;margin-bottom:20px;">
            <span style="font-size:12px;font-weight:700;color:#9a3412;text-transform:uppercase;letter-spacing:0.4px;">Motivo</span>
            <p style="margin:4px 0 0;font-size:14px;color:#111111;">{{rejectionReason}}</p>
          </div>
          <p style="margin:0;font-size:14px;line-height:1.6;color:#374151;">
            Escribinos respondiendo este correo y te ayudamos a resolverlo.
          </p>
        </td></tr>
        <tr><td style="padding:20px 32px;border-top:1px solid #f0f0f0;">
          <p style="margin:0;font-size:12px;color:#9ca3af;">PixelArt — Libros personalizados</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
