<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"></head>
<body style="margin:0;padding:0;background:#f4f7f9;font-family:Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f7f9;padding:32px 0;">
    <tr><td align="center">
      <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:12px;overflow:hidden;">
        <tr><td style="background:#17242d;padding:24px 32px;">
          <span style="color:#ffffff;font-size:18px;font-weight:700;letter-spacing:0.5px;">PixelArt — Ajustes de cubierta</span>
        </td></tr>
        <tr><td style="padding:32px;">
          <h1 style="margin:0 0 16px;font-size:20px;color:#17242d;">El cliente solicitó ajustes</h1>
          <p style="margin:0 0 12px;font-size:14px;line-height:1.6;color:#3c4d58;"><strong>{{customerName}}</strong> solicitó cambios para: <strong>{{adjustmentSurface}}</strong></p>
          <p style="margin:0 0 22px;padding:14px;border:1px solid #d9e7ef;border-radius:8px;background:#f7fbfd;font-size:14px;line-height:1.6;color:#263946;white-space:pre-wrap;">{{adjustmentMessage}}</p>
          <a href="{{actionUrl}}" style="display:inline-block;background:#2d8fd5;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;padding:13px 20px;border-radius:8px;">Revisar solicitud</a>
        </td></tr>
        <tr><td style="padding:20px 32px;border-top:1px solid #edf1f3;">
          <p style="margin:0;font-size:12px;color:#71808a;">PixelArt — Notificación automática</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
