name: Deploy

# Deploys main to the production VPS after CI succeeds on main.
# Can also be triggered by hand (Actions -> Deploy -> Run workflow) to
# redeploy the current main.
#
# Required repository secrets:
#   VPS_HOST         production server address
#   VPS_USER         SSH user allowed to run docker on the server (deploy)
#   VPS_SSH_KEY      private key of a key pair used ONLY for deploys
#   VPS_KNOWN_HOSTS  the server's host key line(s) (ssh-keyscan output)
# Application secrets (OpenAI, Resend, database...) live only in
# /opt/pixelart/.env.docker.local on the server, never in GitHub.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    # Manual runs deploy main only: a dispatch from any other branch would
    # ship code that never went through CI.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - name: Resolve commit to deploy
        id: target
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy (rolls back to the previous commit on failure)
        env:
          SHA: ${{ steps.target.outputs.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$VPS_USER@$VPS_HOST" "SHA=$SHA bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/pixelart
          PREV=$(git rev-parse HEAD)
          git fetch --quiet origin
          git checkout --quiet --detach "$SHA"
          echo "Deploying $SHA (previous: $PREV)"
          if ! bash scripts/deploy.sh; then
            echo "::error::Deploy of $SHA failed; rolling back to $PREV"
            git checkout --quiet --detach "$PREV"
            if ! bash scripts/deploy.sh; then
              echo "::error::Rollback to $PREV failed too; the server needs manual attention"
            fi
            exit 1
          fi
          REMOTE
