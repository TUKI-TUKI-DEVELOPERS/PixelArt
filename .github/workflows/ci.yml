name: CI

# Runs on every pull request to main and on every push to main.
# main is protected: changes land only through a PR with these checks green.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        working-directory: backend/api
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        working-directory: backend/api
        run: npm test -- --ci

  frontend:
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        working-directory: frontend/web
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        working-directory: frontend/web
        run: npm test

  docker-build:
    name: Production images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build api and web production images
        # Dummy values only satisfy the compose `${VAR:?}` guards; nothing runs.
        env:
          POSTGRES_PASSWORD: ci-build-only
          MINIO_ACCESS_KEY: ci-build-only
          MINIO_SECRET_KEY: ci-build-only
          JWT_SECRET: ci-build-only
        run: |
          touch .env.docker.local
          docker compose -f infra/docker/docker-compose.prod.yml build api web
