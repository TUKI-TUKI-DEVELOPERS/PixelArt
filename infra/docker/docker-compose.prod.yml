version: "3.9"

# ─── MODO PRODUCCIÓN (VPS) ─────────────────────────────────────────────────────
# Build de producción (target: prod), sin bind-mounts de código fuente.
#   docker compose -f infra/docker/docker-compose.prod.yml up --build -d
#
# Requiere infra/docker/.env.docker.local con las variables reales (nunca en git —
# ver .gitignore, patrón .env.*.local).
# ──────────────────────────────────────────────────────────────────────────────

services:
  # ─── Infraestructura — sin puertos publicados, solo accesibles en la red interna ──
  postgres:
    image: postgres:16-alpine
    container_name: pixelart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pixelart}
      POSTGRES_USER: ${POSTGRES_USER:-pixelart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pixelart_secret}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../schemaPixelart.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pixelart} -d ${POSTGRES_DB:-pixelart}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pixelart_redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Pineado a una versión pre-2024: las imágenes minio/minio:latest recientes
    # requieren microarquitectura x86-64-v2, que esta VPS no soporta (ver logs:
    # "Fatal glibc error: CPU does not support x86-64-v2").
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    container_name: pixelart_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pixelart_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-pixelart_secret_key}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-mc:
    # Misma razón que el servicio minio — pineado a una versión de la misma época
    image: minio/mc:RELEASE.2023-09-29T16-41-22Z
    container_name: pixelart_minio_mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-pixelart_access}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-pixelart_secret_key}
      MINIO_BUCKET: ${MINIO_BUCKET:-pixelart-assets}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
        mc mb local/$$MINIO_BUCKET --ignore-existing &&
        mc anonymous set download local/$$MINIO_BUCKET &&
        echo 'MinIO: bucket $$MINIO_BUCKET listo.'
      "
    restart: "no"

  # ─── Aplicaciones ───────────────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: backend/api/Dockerfile.prod
      target: prod
    container_name: pixelart_api
    restart: unless-stopped
    env_file:
      - ../../.env.docker.local
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      NODE_ENV: production
      # URL pública real del sitio — usada para armar links de checkout/feedback/
      # demo que se mandan por email. Sin esto cae al fallback 'http://localhost:3000'
      # del código, que solo es válido en dev. DEBE estar seteada en .env.docker.local.
      NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL:-}
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ../..
      dockerfile: frontend/web/Dockerfile.prod
      target: prod
      args:
        API_INTERNAL_URL: http://api:3001
        MINIO_INTERNAL_URL: http://minio:9000
    container_name: pixelart_web
    restart: unless-stopped
    env_file:
      - ../../.env.docker.local
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_MINIO_URL: ${NEXT_PUBLIC_MINIO_URL:-}
      API_INTERNAL_URL: http://api:3001
      MINIO_INTERNAL_URL: http://minio:9000
    ports:
      - "3000:3000"   # único servicio expuesto al host — el resto vive solo en la red interna
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - default
      # Red del nginx compartido (puente) — sin esto, cada vez que se recrea el
      # contenedor pierde la conexión manual (docker network connect) y puente
      # no puede alcanzarlo (502). Ver docs/deploy-strategy.md.
      - shared-gateway

networks:
  default: {}
  shared-gateway:
    external: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
